name: Desplegar en GitHub Pages

# El sitio publicado contiene main en la raíz y cada PR abierta del propio
# repositorio en /pr-<número>/. Cada ejecución reconstruye el sitio entero,
# así que la preview de una PR desaparece en cuanto se cierra o se fusiona.
on:
  push:
    branches: [main]
  # pull_request_target ejecuta este workflow tal y como está en main, lo que
  # permite desplegar en el entorno github-pages (restringido a main). Solo se
  # construyen PRs cuya rama vive en este repositorio, nunca las de forks.
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      REPO: ${{ github.repository }}
      BASE: /${{ github.event.repository.name }}/
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Construir las previews de las PRs abiertas
        run: |
          prs=$(gh api "repos/$REPO/pulls?state=open&per_page=100" --paginate \
            --jq '.[] | select(.head.repo.full_name == env.REPO) | .number')
          for n in $prs; do
            echo "::group::PR #$n"
            dir="$RUNNER_TEMP/pr-$n"
            if git fetch --no-tags --depth=1 \
                 "https://x-access-token:$GH_TOKEN@github.com/$REPO.git" "refs/pull/$n/head" \
               && git worktree add --detach "$dir" FETCH_HEAD \
               && (cd "$dir" && npm ci && npx tsc --noEmit \
                   && npx vite build --base="${BASE}pr-$n/" --outDir "$GITHUB_WORKSPACE/dist/pr-$n" --emptyOutDir); then
              echo "PR #$n publicada en ${BASE}pr-$n/"
            else
              echo "::warning::No se pudo construir la preview de la PR #$n"
              rm -rf "dist/pr-$n"
            fi
            echo "::endgroup::"
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  comment:
    needs: deploy
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const marker = '<!-- preview-pages -->';
            const url = `${process.env.PAGE_URL.replace(/\/?$/, '/')}pr-${pr.number}/`;
            const body = context.payload.action === 'closed'
              ? `${marker}\nPreview retirada al cerrar la PR.`
              : `${marker}\n**Preview:** ${url}\n\nActualizada con \`${pr.head.sha.slice(0, 7)}\`.`;
            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number,
            });
            const previous = comments.find(c => c.body?.startsWith(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else if (context.payload.action !== 'closed') {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            }
